name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'master']

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Create Next.js types directory
        run: |
          mkdir -p .next/dev/types
          echo "// Generated for CI type checking" > .next/dev/types/routes.d.ts
          echo "export {};" >> .next/dev/types/routes.d.ts

      - name: Run TypeScript type check
        run: yarn lint-ts

      - name: Run Stylelint
        run: yarn lint:css

      - name: Run tests with coverage
        run: yarn coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      # E2E tests (optional, can be enabled when needed)
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      #
      # - name: Run E2E tests
      #   run: yarn test:e2e
      #   env:
      #     PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL || 'http://localhost:3000' }}

      - name: Run GraphQL codegen (before production build)
        run: yarn codegen
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_URL: ${{ secrets.SHOPIFY_ADMIN_URL }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_URL: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_URL }}
          SHOPIFY_STORE_FRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STORE_FRONT_ACCESS_TOKEN }}
        continue-on-error: true
        # When secrets are unset (e.g. fork PRs), build still uses committed `src/infra/shopify/generated/`.

      - name: Build production bundle
        run: yarn build
        env:
          # Required env vars for build (use defaults if secrets not available)
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'https://example.com' }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_URL: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_URL || 'https://example.myshopify.com' }}
          SHOPIFY_STORE_FRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STORE_FRONT_ACCESS_TOKEN || 'test-token' }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID || 'test-client-id' }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET || 'test-client-secret' }}
          SHOPIFY_ADMIN_URL: ${{ secrets.SHOPIFY_ADMIN_URL || 'https://example.myshopify.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-openai-key' }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN || 'test-upload-token' }}
          UPLOADTHING_SECRET: ${{ secrets.UPLOADTHING_SECRET || 'test-upload-secret' }}
          # Build-time only vars (not used at runtime in build)
          AI_API_SECRET: ${{ secrets.AI_API_SECRET || 'test-ai-secret' }}
          UPLOADTHING_API_SECRET: ${{ secrets.UPLOADTHING_API_SECRET || 'test-uploadthing-api-secret' }}
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN || 'test-printful-token' }}
          PRINTFUL_API_SECRET: ${{ secrets.PRINTFUL_API_SECRET || 'test-printful-api-secret' }}
          NODE_ENV: production
