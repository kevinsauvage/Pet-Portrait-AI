name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'master']

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Create Next.js types directory
        run: |
          mkdir -p .next/dev/types
          echo "// Generated for CI type checking" > .next/dev/types/routes.d.ts
          echo "export {};" >> .next/dev/types/routes.d.ts

      - name: Run TypeScript type check
        run: yarn lint-ts

      - name: Run Stylelint
        run: yarn lint:css

      - name: Run tests with coverage
        run: yarn coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      # E2E tests (optional, can be enabled when needed)
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      #
      # - name: Run E2E tests
      #   run: yarn test:e2e
      #   env:
      #     PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL || 'http://localhost:3000' }}

      - name: Run codegen (if env vars available)
        run: yarn codegen
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_URL: ${{ secrets.SHOPIFY_ADMIN_URL }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_URL: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_URL }}
          SHOPIFY_STORE_FRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STORE_FRONT_ACCESS_TOKEN }}
        continue-on-error: true
        # Codegen requires Storefront token to be set directly.
